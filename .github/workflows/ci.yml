name: CI

on:
  push:
    branches: [main]
  pull_request:

# PRs only: cancel-in-progress on main kills the slow macOS race shards mid-run,
# leaving commits with no CI verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Timeouts kill a wedged test in minutes instead of GitHub's 6-hour cap.
jobs:
  source-release-residue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Verify source-only release contract
        run: ./scripts/release-check.sh --tree

  # The macOS test host: the daemonkit-coupled packages, which cannot build off
  # darwin, plus the portable-but-macOS-tested ones from ci/macos-tested.txt.
  # ./catalog is daemonkit-free now — it builds and vets on linux, which
  # portable-gate.sh proves — but its ~500-800s -race suite is dealt across
  # these shards rather than run whole on the linux smoke job; ./mountmux keeps
  # its darwin-only native-mount tests here for the same routing reason.
  # scripts/ci-packages.sh macos-tested emits exactly this set. Test-host
  # membership is not daemonkit-coupling: ci/portable.txt is the build gate,
  # ci/macos-tested.txt is the test-host carve-out over it.
  #
  # Tests are dealt across the shards by name rather than by package: ./catalog
  # alone is most of the suite's runtime, so a per-package split would pin the
  # slowest shard to it. Four shards is the ceiling — macOS concurrency is ~5
  # org-wide and the swift and fuse-macos jobs take two of those slots.
  test:
    name: test (shard ${{ matrix.shard }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test (race, via the process-cap harness)
        shell: bash
        # ./catalog dominates the suite; the by-name deal lands its heaviest
        # quarter near 250s under -race locally, which a slow, noisy CI runner
        # can inflate past the harness's 600s per-invocation default. 900s
        # clears that with headroom — and still exceeds the ~800s a whole
        # single-process ./catalog would take, should the deal ever degenerate
        # — while tripping a genuine hang well inside the 30-minute job cap.
        env:
          TEST_SHARD_TIMEOUT: 900s
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(./scripts/ci-packages.sh macos-tested)
          ./scripts/test-race-shard.sh "${{ matrix.shard }}" 4 "${packages[@]}"

  # The daemonkit-free subset — the only packages that still build off darwin.
  # portable-gate.sh proves every one of them builds and vets on linux, so a
  # package that gains a daemonkit edge fails here by name instead of as an
  # inscrutable linux build error. The test step below then RUNS only the
  # linux-safe subset (ci-packages.sh linux-tested); a free package too slow or
  # too darwin-leaning to test on linux is listed in ci/macos-tested.txt and its
  # tests run on the macOS shard job, though its build stays gated here.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Daemonkit-free subset gate
        run: ./scripts/portable-gate.sh

      - name: Test (race, via the process-cap harness)
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(./scripts/ci-packages.sh linux-tested)
          ./scripts/test.sh -p=1 -race -count=1 -timeout=300s "${packages[@]}"

      - name: Pure build gate (CGO_ENABLED=0, cross-compiled for darwin)
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build ./...

  # Static analysis type-checks the tree, so it runs for darwin. GOOS/GOARCH
  # keep it on a cheap linux runner instead of billing macOS minutes 10x.
  #
  # TODO: add golangci-lint here. It reports 41 pre-existing issues (31 unused,
  # 7 errcheck, 3 staticcheck) that the prek hook never surfaces, because that
  # hook only ever sees a commit's changed files. Fixing those is a Go-source
  # change and does not belong in a CI restructure.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOOS: darwin
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        # The install itself is a host build; GOOS/GOARCH have to come off for it.
        run: |
          env -u GOOS -u GOARCH go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # The `-tags fuse` tree needs cgofuse's native headers, which no cross-compile
  # supplies, so this is the only job that can vet, build, or exercise it. The
  # linux half of this gate is gone: fusekit does not build for linux at all
  # once daemonkit goes darwin-only, so libfuse2 had nothing left to prove.
  fuse-macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install fuse-t (build-time headers + dylib)
        run: brew install macos-fuse-t/cask/fuse-t

      - name: go vet (fuse)
        run: CGO_ENABLED=1 go vet -tags fuse ./...

      - name: Build smoke (fuse)
        run: CGO_ENABLED=1 go build -tags fuse ./...

      # Callback-level only. Signed-child, live-mount, and TCC gates run in an
      # isolated VM with the consumer app identity installed.
      - name: Test (fuse callbacks)
        shell: bash
        run: |
          packages=()
          while IFS= read -r package; do
            packages+=("$package")
          done < <(
            git grep -l '^//go:build .*fuse' -- '*_test.go' |
              while IFS= read -r file; do dirname "$file"; done |
              sort -u |
              sed 's#^#./#'
          )
          (( ${#packages[@]} > 0 ))
          CGO_ENABLED=1 ./scripts/test.sh -tags fuse -count=1 "${packages[@]}"

  swift:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install lint tools missing from the image
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint

      # Three of these five gen packages import daemonkit, so this stays on a
      # macOS runner with the rest of the coupled tree.
      - name: Generated schema drift
        run: |
          go run ./catalogproto/gen -check
          go run ./catalogworker/gen -check
          go run ./mountproto/gen -check
          go run ./sourcedriverproto/gen -check
          go run ./transportproto/gen -check

      - name: Format (lint mode)
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint --quiet

      - name: Build
        run: swift build

      - name: Test
        run: swift test
